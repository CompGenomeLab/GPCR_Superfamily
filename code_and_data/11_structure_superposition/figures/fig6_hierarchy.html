<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Figure 6 draft: GPCR family hierarchy</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background: #fff; color: #222; }
  .bar { margin-bottom: 10px; font-size: 13px; }
  button { font-family: Arial; font-size: 12px; padding: 4px 10px; }
  svg text { font-family: Arial, sans-serif; }
</style>
</head>
<body>
<div class="bar">
  <button id="dl">Download SVG</button>
  <span style="color:#666;margin-left:10px">Draft. Edit the DATA block in this file and reload.</span>
</div>
<div id="fig"></div>

<!-- shared-motif presence per family: generated by build_motif_evidence.py from Tables S7 and S9b -->
<script src="motif_evidence_data.js"></script>
<script>
/* ===================== DATA (edit here) =====================
   The most probable hierarchy from all the evidence (trees, taxonomic distribution, literature sequences).
   AXIS: every taxonomic node at which a family or split emerges, left to right (not time); each split's `at`
         and each `start` must be one of these.
   TREE: nested. An internal node (a split) has `at` and `children`, and optionally
     support: "strong" (filled dot, all trees) | "good" (open dot) | "dist" (open square: split placed by the
              taxonomic distribution where the trees do not resolve it); omit for no symbol
     trunk  : true -> the first child continues straight and the others branch off it (a nested family
              branching from its parent family, e.g. Olfactory from Class A)
     gradientFrom: lineage whose colour this branch fades out of
     range  : earliest position this split (or a leaf's `origin`) could have, from trees or literature
              sequences; drawn as a hatched band on the branch from `range` to the confident position
   A leaf has `label`, `lineage` (Glu | cAMP | Rho | none) and `emergence` (kept as a record, not drawn: the x axis shows it), and
   optionally `start` with `detached: true` for a family the trees do not place: its line begins at `start` and is
   not connected to the parent split (it stays in its lineage's row block).
============================================================ */
const DATA = {
  AXIS: ["LECA", "Unikonta", "Opisthokonta", "Holozoa", "Fungi", "Metazoa", "Ascomycota", "Eumetazoa",
         "Bilateria", "Chromadorea", "Craniata", "Gnathostomata", "extant"],
  /* identical to the structure figure (Fig. 5, step12 make_fig4.py); grey = the Fig. 5 helix grey */
  COLOURS: {
    fill: { Glu: "#E2BB94", cAMP: "#BCBCFA", Rho: "#F99696", none: "#B4B4B4" },
    line: { Glu: "#E2BB94", cAMP: "#BCBCFA", Rho: "#F99696", none: "#B4B4B4" }
  },
  TREE: {
    at: "LECA",   // the root sits on LECA
    children: [
      { at: "Bilateria", trunk: true, support: "dist", lineage: "Glu",
        children: [ { label: "Class C", lineage: "Glu", emergence: "LECA" },
                    { label: "Vomeronasal 2", lineage: "Glu", emergence: "Bilateria" } ] },
      { at: 0.35, lineage: "cAMP",   // cAMP-related split just after the root (still LECA)
        children: [
          { label: "cAMP", lineage: "cAMP", emergence: "LECA" },
          { at: "Unikonta", support: "good", lineage: "cAMP",
            children: [
              { at: "Holozoa", trunk: true, support: "strong", lineage: "cAMP",
                children: [ { label: "Mth", lineage: "cAMP", emergence: "Unikonta" },
                  { at: "Eumetazoa", trunk: true, support: "strong", lineage: "cAMP",
                    children: [ { label: "Class B2", lineage: "cAMP", emergence: "Holozoa" },
                                { label: "Class B1", lineage: "cAMP", emergence: "Eumetazoa" } ] } ] },
              { at: "Metazoa", trunk: true, support: "good", lineage: "cAMP",
                children: [ { label: "FSL", lineage: "cAMP", emergence: "Unikonta" },
                            { label: "Class F", lineage: "cAMP", emergence: "Metazoa" } ] }
            ] },
          { at: "Holozoa", support: "strong", lineage: "cAMP",
            children: [ { label: "GP143", lineage: "cAMP", emergence: "Holozoa" },
                        /* split from GP143 at Holozoa (the Capsaspora GP143 sequence), but TM116 is present
                           only in animals: hatched from the split to Metazoa */
                        { label: "TM116", lineage: "cAMP", emergence: "Metazoa", origin: "Metazoa", range: "Holozoa" } ] },
          { label: "GP157", lineage: "cAMP", emergence: "Unikonta", origin: "Unikonta", range: "LECA" },
          /* not placed by the trees: a free line from its emergence, inside the cAMP-related band (motifs) */
          { label: "STE3", lineage: "cAMP", emergence: "Fungi", start: "Fungi", detached: true },
          { at: "Opisthokonta", lineage: "cAMP",
            children: [
              /* split from Class A at Opisthokonta (trees), but GPR1 is present only in Fungi (distribution):
                 hatched from the split to Fungi, as for Taste-2 */
              { label: "GPR1", lineage: "cAMP", emergence: "Fungi", origin: "Fungi", range: "Opisthokonta" },
              /* Class A: possible earlier origin back to LECA (stable SAR Class A sequences within the Class A clade) */
              { at: "Chromadorea", trunk: true, support: "dist", lineage: "Rho", gradientFrom: "cAMP",
                origin: "Opisthokonta", range: "LECA",
                bandPast: 12,   // px: the band runs a little below Opisthokonta, past the corner, into the Class A line
                children: [
                  /* the Taste-2 + V1 ancestor branches off Class A just before Craniata (both splits are at or
                     before Craniata: V1 is present in lamprey); Taste-2 and V1 are sisters, not one from the other */
                  { at: 9.7, trunk: true, support: "dist", lineage: "Rho",
                    children: [
                      { at: "Craniata", trunk: true, support: "dist", lineage: "Rho",
                        children: [ { label: "Class A", lineage: "Rho", emergence: "Opisthokonta" },
                                    { label: "Olfactory", lineage: "Rho", emergence: "Craniata" } ] },
                      { at: "Craniata", support: "strong", lineage: "Rho",
                        children: [ { label: "Vomeronasal 1", lineage: "Rho", emergence: "Craniata" },
                                    /* branches off with V1 at Craniata, but present from Gnathostomata: the
                                       band marks the possible earlier origin */
                                    { label: "Taste-2", lineage: "Rho", emergence: "Gnathostomata",
                                      origin: "Gnathostomata", range: "Craniata" } ] }
                    ] },
                  { label: "Nematode", lineage: "Rho", emergence: "Chromadorea" }
                ] }
            ] }
        ] }
    ]
  },
  DETACHED: [ { label: "STE2", lineage: "none", emergence: "Ascomycota", start: "Ascomycota" } ],
  /* soft background per lineage (first to last family), named above it; "\n" breaks the bold name */
  GROUPS: [
    { from: "Class C", to: "Vomeronasal 2", lineage: "Glu",  text: ["Glutamate-\nrelated"] },
    { from: "cAMP", to: "GPR1", lineage: "cAMP", text: ["cAMP-related"] },
    { from: "Class A", to: "Nematode", lineage: "Rho", text: ["Rhodopsin-related"] },
    { from: "STE2", to: "STE2", lineage: "none", text: ["Atypical\nGPCR\nfamily"] }
  ],
  NOTES: {},   // optional small italic note per family, e.g. { "STE3": "placed by motifs and structure" }
  XLABEL: "Taxonomic node",
  SHOW_AXIS: true,     // taxonomic node labels left of the tree (the AXIS still places the splits)
  SHOW_GRID: true,     // dashed horizontal lines across the families from each taxonomic node
  SHOW_SUPPORT: false, // split symbols (all trees / most trees / placed by distribution) and their legend entries
  /* shared motifs below the family names, one row each in sequence order, with the evidence for each family (sequence and structure /
     sequence only / structure only; FIG6 in motif_evidence_data.js, rules in build_motif_evidence.py) */
  SHOW_MOTIFS: true
};

/* ===================== DRAWING ===================== */
/* Vertical layout: the taxonomic nodes run down the page (LECA at the top), families sit in columns left to right
   (STE2 last), family names below the tree, then the shared motifs as rows with their GPCRdb numbers on the left. */
// left: room for the widest left label ("P4x53_B / P4x43_C", ~92 px); colW: the rest of the 795 px width
const L = { left: 115, top: 78, step: 34, colW: 31.8, nameH: 100, lw: 6, corner: 8, tint: 0.22, cell: 18 };
const NS = "http://www.w3.org/2000/svg", C = DATA.COLOURS;
const AX = {};
DATA.AXIS.forEach((a, i) => { AX[a] = i; });
const pos = v => { if (typeof v === "number") return v; if (v in AX) return AX[v]; throw new Error("axis node " + v); };
const T = v => L.top + pos(v) * L.step;                 // vertical position of a taxonomic node
const END = T(DATA.AXIS[DATA.AXIS.length - 1]);          // tips of the tree

// layout: leaves in consecutive columns; a split sits at its children's midpoint, or on its first child with `trunk`
let col = 0;
const leaves = {};
(function lay(n) {
  if (n.children) {
    n.children.forEach(lay);
    n.x = n.trunk ? n.children[0].x : (n.children[0].x + n.children[n.children.length - 1].x) / 2;
  } else { n.x = L.left + col++ * L.colW + L.colW / 2; leaves[n.label] = n; }
})(DATA.TREE);
col += 0.5;
DATA.DETACHED.forEach(n => { n.x = L.left + col++ * L.colW + L.colW / 2; leaves[n.label] = n; });
const xRight = L.left + col * L.colW;                    // right edge of the last family column
const xAxis = L.left - 6;                                // taxonomic axis and all row labels sit left of this
const NAME_Y = END + 10;                                 // family names hang below the tree tips
const MOT = DATA.SHOW_MOTIFS && typeof FIG6 !== "undefined" ? FIG6 : null;
const MY0 = END + L.nameH;                               // top of the first motif row
const MOT_END = MY0 + (MOT ? MOT.motifs.length * L.cell : 0);
const lg1 = MOT_END + 26, lg2 = lg1 + (MOT ? 20 : 0);     // legend rows (lg2: split support, when shown)
const W = xRight + 60, H = (DATA.SHOW_SUPPORT ? lg2 : lg1) + 14;

const svg = document.createElementNS(NS, "svg");
svg.setAttribute("xmlns", NS); svg.setAttribute("font-family", "Arial, sans-serif"); svg.setAttribute("width", W); svg.setAttribute("height", H);
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
const el = (tag, a, p = svg) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
const text = (x, y, s, a = {}) => {
  const t = el("text", { x, y, "font-size": 12, fill: "#222", ...a });
  String(s).split("\n").forEach((line, i) => { const sp = el("tspan", { x, dy: i ? "1.2em" : 0 }, t); sp.textContent = line; });
  return t;
};
const defs = el("defs", {});
// the hatched bands lie above the lines, so their stripes run unbroken across the band
const gBg = el("g", {}), gGrid = el("g", {}), gStem = el("g", {}), gBand = el("g", {}), gMark = el("g", {});
let gradN = 0;

// lineage backgrounds (one band per lineage, from the top to the last motif row) and their names above
DATA.GROUPS.forEach(g => {
  const x0 = leaves[g.from].x - L.colW / 2 + 2, x1 = leaves[g.to].x + L.colW / 2 - 2;
  el("rect", { x: x0, y: 8, width: x1 - x0, height: MOT_END + 6 - 8, rx: 9,
    fill: C.fill[g.lineage], "fill-opacity": L.tint }, gBg);
  // the name in bold (a "\n" in it breaks the line), the emergence below it in regular weight
  const name = g.text[0].split("\n"), rest = g.text.slice(1);
  const t = text((x0 + x1) / 2, 24, [...name, ...rest].join("\n"),
    { "font-size": 12, "font-weight": "bold", fill: "#222", "text-anchor": "middle" });
  [...t.childNodes].slice(name.length).forEach(sp => { sp.setAttribute("font-weight", "normal"); sp.setAttribute("fill", "#555"); });
});

// taxonomic axis on the left: one label per node, dashed guide lines across the families
if (DATA.SHOW_AXIS) {
  DATA.AXIS.forEach(a => {
    if (a === "extant") return;
    const y = T(a);
    if (DATA.SHOW_GRID) el("line", { x1: xAxis, x2: xRight, y1: y, y2: y, stroke: "#999", "stroke-width": 0.8,
                                     "stroke-dasharray": "3 3" }, gGrid);
    el("line", { x1: xAxis - 4, x2: xAxis, y1: y, y2: y, stroke: "#999", "stroke-width": 1 });
    text(xAxis - 7, y + 4, a, { "font-size": 12, fill: "#222", "font-weight": "bold", "text-anchor": "end" });
  });
  el("line", { x1: xAxis, x2: xAxis, y1: T(DATA.AXIS[0]), y2: END, stroke: "#999", "stroke-width": 1 });
  // no axis title (DATA.XLABEL is unused): the node names speak for themselves and the space goes to the columns
}
text(xAxis - 7, NAME_Y + 44, "Family", { "font-size": 12, fill: "#222", "font-weight": "bold", "text-anchor": "end" });

// GPCRdb label: "_X" becomes the class letter as a capital subscript
function gpcrdb(t, label) {
  t.textContent = "";
  label.split(/(_[A-Z])/).forEach(part => {
    if (!part) return;
    const sp = document.createElementNS(NS, "tspan");
    if (part[0] === "_") { sp.setAttribute("baseline-shift", "sub"); sp.setAttribute("font-size", "75%"); sp.textContent = part[1]; }
    else sp.textContent = part;
    t.appendChild(sp);
  });
}

// shared-motif rows: GPCRdb numbers on the left
const motifY = i => MY0 + i * L.cell + L.cell / 2;
if (MOT) {
  MOT.motifs.forEach((m, i) => {
    gpcrdb(text(xAxis - 7, motifY(i) + 4, "", { "font-size": 12, fill: "#222", "font-weight": "bold", "text-anchor": "end" }), m);
  });
}

// evidence symbol: full dot = sequence and structure, left half = sequence only, right half = structure only
function evidence(ev, cx, cy, p = svg) {
  const g = el("g", {}, p), r = 4.6;
  if (ev === "both") el("circle", { cx, cy, r, fill: "#3a3a3a", stroke: "#3a3a3a", "stroke-width": 1.2 }, g);
  else {
    const s = ev === "sequence" ? 0 : 1;
    el("circle", { cx, cy, r, fill: "#fff" }, g);
    el("path", { d: `M ${cx} ${cy - r} A ${r} ${r} 0 0 ${s} ${cx} ${cy + r} Z`, fill: "#3a3a3a" }, g);
    el("circle", { cx, cy, r, fill: "none", stroke: "#3a3a3a", "stroke-width": 1.2 }, g);
  }
  return g;
}

function cells(n) {
  if (!MOT || !MOT.rows[n.label]) return;
  MOT.rows[n.label].forEach((c, i) => {
    if (!c.ev) return;                            // no evidence: left empty
    const g = evidence(c.ev, n.x, motifY(i));
    const t = document.createElementNS(NS, "title");
    t.textContent = `${MOT.motifs[i].replace(/_/g, "")} (${c.ev === "both" ? "sequence and structure" : c.ev + " only"}): ${c.note}`;
    g.appendChild(t);
  });
}

const darker = (c, f = 0.72) => "#" + [1, 3, 5].map(i => Math.round(parseInt(c.substr(i, 2), 16) * f)
  .toString(16).padStart(2, "0")).join("");

const BAND_SHADE = 0.25;   // opacity of the darker shade under the stripes of a possible-earlier-origin section

function hatch(lineage) {
  const id = "hatch-" + lineage;
  if (!defs.querySelector("#" + id)) {
    // transparent between the stripes, so the branch shows through; stripes in a darker shade of the lineage
    // colour, so they stay visible where they cross the branch
    const p = el("pattern", { id, patternUnits: "userSpaceOnUse", width: 5, height: 5, patternTransform: "rotate(45)" }, defs);
    // "key": black stripes for the legend key only
    el("line", { x1: 0, x2: 0, y1: 0, y2: 5, stroke: lineage === "key" ? "#222" : darker(C.line[lineage]), "stroke-width": 2.2 }, p);
  }
  return `url(#${id})`;
}

function band(n) {
  if (n.range === undefined) return;
  // from the earliest possible position to the confident one: `origin` if given (a family, or a family's line
  // that also carries later splits, e.g. Class A), otherwise the split itself
  const y0 = T(n.range), y1 = T(n.origin !== undefined ? n.origin : n.at) + (n.bandPast || 0);
  // a slight darkening of the whole section (BAND_SHADE), with the stripes over it
  el("rect", { x: n.x - 7, y: y0, width: 14, height: y1 - y0, rx: 7, fill: darker(C.line[n.lineage]),
               "fill-opacity": BAND_SHADE }, gBand);
  el("rect", { x: n.x - 7, y: y0, width: 14, height: y1 - y0, rx: 7, fill: hatch(n.lineage) }, gBand);
}

// a branch from its parent split (px, pt) to this node: along the parent's connector, a rounded corner,
// then down its own column to its split (or the tips for a family)
function branch(n, px, pt) {
  band(n);
  if (n.detached) {
    el("path", { d: `M ${n.x} ${T(n.start)} L ${n.x} ${END}`, stroke: C.line[n.lineage], "stroke-width": L.lw,
                 "stroke-linecap": "round" }, gStem);
    return;
  }
  const colour = C.line[n.lineage || "none"];
  const t1 = n.children ? T(n.at) : END;
  let stroke = n.rootChild ? "url(#root)" : colour;   // root branches share the root gradient, so the lineages blend
  if (n.gradientFrom) {
    const id = "g" + gradN++;
    const g = el("linearGradient", { id, gradientUnits: "userSpaceOnUse", x1: 0, x2: 0, y1: pt, y2: pt + 2.5 * L.step }, defs);
    el("stop", { offset: "0%", "stop-color": C.line[n.gradientFrom] }, g);
    el("stop", { offset: "100%", "stop-color": colour }, g);
    stroke = `url(#${id})`;
  }
  const dx = n.x - px, r = Math.min(L.corner, Math.abs(dx)), s = Math.sign(dx);
  const d = dx === 0 ? `M ${n.x} ${pt} L ${n.x} ${t1}`
    : `M ${px} ${pt} L ${n.x - s * r} ${pt} Q ${n.x} ${pt} ${n.x} ${pt + r} L ${n.x} ${t1}`;
  el("path", { d, fill: "none", stroke, "stroke-width": L.lw, "stroke-linecap": "round", "stroke-linejoin": "round" }, gStem);
}

function supportMark(kind, x, y, p = gMark) {
  if (kind === "strong") el("circle", { cx: x, cy: y, r: 4.2, fill: "#333", stroke: "#fff", "stroke-width": 1.5 }, p);
  else if (kind === "good") el("circle", { cx: x, cy: y, r: 4.2, fill: "#fff", stroke: "#333", "stroke-width": 1.5 }, p);
  else if (kind === "dist") el("rect", { x: x - 3.8, y: y - 3.8, width: 7.6, height: 7.6, rx: 1.2, fill: "#fff", stroke: "#333", "stroke-width": 1.5 }, p);
}

// family name below the tips, reading upwards; a note runs up alongside the family's line
function label(n) {
  cells(n);
  text(n.x + 4, NAME_Y, n.label, { "font-size": 12, "text-anchor": "end", transform: `rotate(-90 ${n.x + 4} ${NAME_Y})` });
  const note = DATA.NOTES[n.label];
  if (note) text(n.x + 16, END - 8, note, { "font-size": 9.5, fill: "#777", "font-style": "italic",
    transform: `rotate(-90 ${n.x + 16} ${END - 8})` });
}

const mix = (a, b) => "#" + [1, 3, 5].map(i => Math.round((parseInt(a.substr(i, 2), 16) + parseInt(b.substr(i, 2), 16)) / 2)
  .toString(16).padStart(2, "0")).join("");

(function draw(n, px, pt) {
  if (px !== null) branch(n, px, pt);
  if (!n.children) { label(n); return; }
  const t = T(n.at);
  if (px === null) {
    // root: the two lineage colours meet and merge, with a short stem in the blended colour
    const first = n.children[0], last = n.children[n.children.length - 1];
    const c0 = C.line[first.lineage], c1 = C.line[last.lineage];
    const g = el("linearGradient", { id: "root", gradientUnits: "userSpaceOnUse", x1: first.x, x2: last.x, y1: 0, y2: 0 }, defs);
    el("stop", { offset: "0%", "stop-color": c0 }, g);
    el("stop", { offset: "100%", "stop-color": c1 }, g);
    el("path", { d: `M ${n.x} ${t - 0.5 * L.step} L ${n.x} ${t}`, stroke: mix(c0, c1), "stroke-width": L.lw, "stroke-linecap": "round" }, gStem);
  }
  n.children.forEach(c => { c.rootChild = px === null; draw(c, n.x, t); });
  if (px !== null && DATA.SHOW_SUPPORT) supportMark(n.support, n.x, t);
})(DATA.TREE, null, null);

DATA.DETACHED.forEach(n => {
  el("path", { d: `M ${n.x} ${T(n.start)} L ${n.x} ${END}`, stroke: C.line[n.lineage], "stroke-width": L.lw, "stroke-linecap": "round" }, gStem);
  label(n);
});

// legend under the motif rows: motif evidence first, then the tree symbols
if (MOT) {
  let mx = L.left;
  text(mx, lg1, "Motif evidence:", { "font-size": 10, fill: "#555", "font-weight": "bold" });
  mx += 86;
  [["both", "sequence and structure"], ["sequence", "sequence only"], ["structure", "structure only"]].forEach(([ev, s]) => {
    evidence(ev, mx + 5, lg1 - 4);
    text(mx + 16, lg1, s, { "font-size": 10, fill: "#555" });
    mx += 36 + s.length * 5.2;
  });
}
const items = DATA.SHOW_SUPPORT ? [["strong", "split in all trees"], ["good", "split in most trees"],
               ["dist", "split placed by taxonomic distribution"]] : [];
let lx = L.left;
items.forEach(([k, s]) => {
  supportMark(k, lx + 6, lg2 - 4, svg);
  text(lx + 16, lg2, s, { "font-size": 10, fill: "#555" });
  lx += 36 + s.length * 5.2;
});

// "possible earlier origin" key in the top-left corner, above the taxonomic labels
el("rect", { x: 8, y: 14, width: 20, height: 14, rx: 7, fill: "#B4B4B4", "fill-opacity": BAND_SHADE });
el("rect", { x: 8, y: 14, width: 20, height: 14, rx: 7, fill: hatch("key") });
text(34, 24, "possible earlier\norigin", { "font-size": 10, fill: "#555" });

svg.insertBefore(defs, svg.firstChild);
document.getElementById("fig").appendChild(svg);
document.getElementById("dl").onclick = () => {
  const blob = new Blob([new XMLSerializer().serializeToString(svg)], { type: "image/svg+xml" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "fig6_hierarchy.svg"; a.click();
};
</script>
</body>
</html>
